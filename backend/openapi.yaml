        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID du média."
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Droits d'accès du média."
          content:
            "application/json":
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/MediaAccess"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`MEDIA_NOT_FOUND` — aucun média ne correspond à cet identifiant."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      operationId: mediaAccessGrant
      tags:
        - media
      summary: "Accorder un accès à un média"
      description: "`SUPER_ADMIN` ou `ADMIN` uniquement : « L'`ADMIN` ou le `SUPER_ADMIN` accorde l'autorisation » (D-22). Un responsable ne peut **jamais** s'accorder un accès, ni à lui-même ni à son département (XD-08). Aucun partage par défaut (XD-09) : sans cette opération, un département ne voit rien. `409` si ce destinataire dispose déjà d'une ligne — elle se **modifie**, elle ne se duplique pas, pour que l'auteur du grant initial reste attribuable."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID du média."
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MediaAccessGrant"
      responses:
        "201":
          description: "Droits accordés."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MediaAccess"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`MEDIA_NOT_FOUND` — aucun média ne correspond à cet identifiant."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "`CONFLICT` — règle refusée par la base : droits portant `DELETE` sur un département (XD-07), ligne déjà existante, aucun droit accordé, ou destinataire inexistant."
