  "/api/v1/publications":
    get:
      operationId: publicationsList
      tags:
        - publications
      summary: "Lister les publications"
      description: "Collection publique paginée. **Le filtre de statut n'existe pas** : le service force `PUBLISHED` côté base, un client ne peut donc pas demander les brouillons, même en forgeant la *query*. Le champ `status` reste exposé dans la réponse (utile au back-office)."
      security: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: type
          in: query
          required: false
          description: "Type de publication. Omis ⇒ tous les types."
          schema:
            type: string
            enum:
              - VIDEO
              - PHOTO
              - TEXTE
        - name: category
          in: query
          required: false
          description: "Rubrique éditoriale, qui pilote le routage du frontend. Omis ⇒ toutes les rubriques."
          schema:
            type: string
            enum:
              - ACTUALITE
              - ENSEIGNEMENT
              - MEDIA
              - RESSOURCE
        - name: sort
          in: query
          required: false
          description: "Tri. Colonnes autorisées : `published_at`, `created_at` ; préfixe `-` pour l'ordre décroissant. Défaut : `-published_at` (chronologie décroissante). Toute autre colonne ⇒ 400 VALIDATION_ERROR."
          schema:
            type: string
            enum:
              - published_at
              - "-published_at"
              - created_at
              - "-created_at"
            default: "-published_at"
      responses:
        "200":
          description: "Collection paginée."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicationCollection"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      operationId: publicationsCreate
      tags:
        - publications
      summary: "Créer une publication"
      description: "Administration. `status` vaut `PUBLISHED` par défaut ; `DRAFT` dépublie sans supprimer. `publishedAt` a pour valeur par défaut la date du jour. Le service vérifie la cohérence entre `type` et contenu : `VIDEO` exige un `contentUrl` http(s), `PHOTO` un `contentUrl` ou un `coverMediaId`, `TEXTE` un `body` non vide — sinon `VALIDATION_ERROR`."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 150
                type:
                  type: string
                  enum:
                    - VIDEO
                    - PHOTO
                    - TEXTE
                category:
                  type: string
                  enum:
                    - ACTUALITE
                    - ENSEIGNEMENT
                    - MEDIA
                    - RESSOURCE
                status:
                  type: string
                  enum:
                    - DRAFT
                    - PUBLISHED
                contentUrl:
                  type:
                    - string
                    - "null"
                  maxLength: 1000
                coverMediaId:
                  type:
                    - string
                    - "null"
                  format: uuid
                description:
                  type:
                    - string
                    - "null"
                  maxLength: 5000
                body:
                  type:
                    - array
                    - "null"
                  items:
                    type: string
                    minLength: 1
                    maxLength: 5000
                  maxItems: 50
                author:
                  type:
                    - string
                    - "null"
                  maxLength: 120
                publishedAt:
                  type: string
                  format: date
                  default: "2026-10-06"
                slug:
                  type: string
                  minLength: 2
                  maxLength: 180
              required:
                - title
                - type
                - category
      responses:
        "201":
          description: "Ressource créée."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Publication"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/DuplicateSlug"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
