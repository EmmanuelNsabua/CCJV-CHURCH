      summary: "Supprimer un média"
      description: "Administration. Refusée par défaut si le fichier est encore référencé : la réponse est alors `CONFLICT` avec le détail des usages. `?force=true` détache d'abord les références, puis supprime la ligne **et** le fichier du Storage. Seule la chaîne littérale `true` autorise la suppression forcée : `false` ou toute autre valeur est refusée par Zod (une valeur quelconque ne doit pas être convertie en booléen, `Boolean(\"false\")` valant `true`). `force` est le **seul** paramètre reconnu : le schéma est strict, donc `?forcee=true` (faute de frappe) produit `400 VALIDATION_ERROR` au lieu d'être ignoré — l'absence de `force` réel ne peut pas passer pour un refus de forcer."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID du média."
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          description: "`true` pour supprimer un média encore référencé (les références sont détachées). Défaut : `false`."
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
      responses:
