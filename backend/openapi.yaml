      description: "Administration (`SUPER_ADMIN`, `ADMIN` — `ResourcePolicy`). La ressource est **publiée immédiatement** : il n'existe pas d'état brouillon pour un document.\n\nLe PDF se téléverse d'abord via `POST /media` avec `folder=resources` (seul dossier qui accepte un PDF, jusqu'à 20 Mo), puis son URL publique est fournie ici. Le service refuse (`VALIDATION_ERROR`) une valeur qui ne désigne pas un `.pdf` : une ressource sans document n'a pas de sens.\n\n`slug` est facultatif ; dérivé du nom s'il est omis, **suffixé** s'il est déjà pris."
