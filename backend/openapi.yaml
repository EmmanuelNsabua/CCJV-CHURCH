  "/api/v1/pages/{pageKey}":
    get:
      operationId: pagesGet
      tags:
        - pages
      summary: "Lire le contenu d'une page éditable"
      description: "Il n'existe pas de route de collection : l'énumération des clés éditables vient du registre `domain/content/page-content.ts`, pas de la base. Une clé hors registre produit `PAGE_NOT_FOUND`.\n\nAucun paramètre de requête n'est reconnu : la *query* est validée par un objet strict vide (`emptyQuerySchema`), donc `?nimportequoi=1` produit `400 VALIDATION_ERROR` au lieu d'être ignoré."
      security: []
      parameters:
        - name: pageKey
          in: path
          required: true
          description: "Clé de la page (1 à 60 caractères), telle que le frontend la connaît. Volontairement permissive : une clé inconnue produit un 404 métier (`PAGE_NOT_FOUND`), pas un 400 de forme."
          schema:
            type: string
            minLength: 1
            maxLength: 60
      responses:
        "200":
          description: "Contenu de la page."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StaticPage"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "404":
          description: "`PAGE_NOT_FOUND` — aucune page ne correspond à cette `pageKey`."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    patch:
      operationId: pagesUpdate
      tags:
        - pages
      summary: "Mettre à jour le contenu d'une page éditable"
      description: "Administration. La validation est faite **en deux temps** : forme générale (`{ content: objet }`) par Zod, puis contenu par le schéma de la page dans le service — c'est la seule façon de rejeter une `pageKey` inconnue en `PAGE_NOT_FOUND` et un contenu non conforme en `VALIDATION_ERROR`. `updatedBy` est déduit du jeton vérifié, jamais du corps de la requête : un client ne peut pas falsifier l'auteur de la modification."
      security:
        - bearerAuth: []
      parameters:
        - name: pageKey
          in: path
          required: true
          description: "Clé de la page (1 à 60 caractères), telle que le frontend la connaît. Volontairement permissive : une clé inconnue produit un 404 métier (`PAGE_NOT_FOUND`), pas un 400 de forme."
          schema:
            type: string
            minLength: 1
            maxLength: 60
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                content:
                  type: object
                  additionalProperties: {}
              required:
                - content
              additionalProperties: false
      responses:
        "200":
          description: "Contenu mis à jour."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StaticPage"
        "400":
          description: "`VALIDATION_ERROR` — `content` n'est pas un objet, ou son contenu ne respecte pas le schéma de la page concernée. `details` décrit les champs fautifs."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`PAGE_NOT_FOUND` — la `pageKey` n'est pas une page éditable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/media":
    get:
