  "/api/v1/events":
    get:
      operationId: eventsList
      tags:
        - events
      summary: "Lister les événements"
      description: "Collection publique paginée et filtrée. `status`, `departmentId` et `sort` sont les seuls paramètres reconnus en plus de `page`/`limit` ; aucune borne de date fournie par le client n'est acceptée : la notion d'« à venir » est calculée par le serveur. Tout autre paramètre — une faute de frappe comprise — est refusé en `400 VALIDATION_ERROR`."
      security: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: "État **calculé** depuis `eventDate` : `UPCOMING` (aujourd'hui ou plus tard) ou `ARCHIVED` (passé). Le statut n'existe pas en base ; il est traduit en comparaison de dates par le repository. Omis ⇒ tous les événements."
          schema:
            type: string
            enum:
              - UPCOMING
              - ARCHIVED
        - name: departmentId
          in: query
          required: false
          description: "Ne renvoyer que les événements d'un département donné (UUID)."
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          required: false
          description: "Tri. Colonnes autorisées : `event_date`, `created_at` ; préfixe `-` pour l'ordre décroissant. Défaut : `event_date` croissant — appelé avec `status=UPCOMING`, l'écran public obtient l'événement le plus proche en premier. Toute autre colonne ⇒ 400 VALIDATION_ERROR."
          schema:
            type: string
            enum:
              - event_date
              - "-event_date"
              - created_at
              - "-created_at"
            default: event_date
      responses:
        "200":
          description: "Collection paginée."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventCollection"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      operationId: eventsCreate
      tags:
        - events
      summary: "Créer un événement"
      description: "Administration. `departmentId` peut valoir `null` (événement général) ; s'il est fourni, le service vérifie que le département existe réellement."
