      description: "Qui peut utiliser ce média, et pour quoi faire. Liste **bornée et non paginée** : elle est rendue dans l'enveloppe `{ data: [...] }`, sans `meta` — comme celles de `scriptures`, `schedule` et `social-links`. Réservé au `SUPER_ADMIN` et à l'`ADMIN` : la lecture par un responsable n'est pas arbitrée (docs/029 Q-11, cellule 6.1), et le refus par défaut s'applique. À ne pas confondre avec le **registre des médias** (cellule 5.2), qui, lui, est ouvert au responsable pour les médias où un droit existe."
