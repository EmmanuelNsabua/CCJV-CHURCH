        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`PRAYER_REQUEST_NOT_FOUND` — cette demande de prière est introuvable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    patch:
      operationId: prayerRequestsUpdate
      tags:
        - "prayer-requests"
      summary: "Marquer une demande comme portée"
      description: "Administration. Une seule transition existe en V1 : `NEW → PRAYED`. Le corps est un objet strict dont le seul champ autorisé est `status`, avec la seule valeur littérale `PRAYED` — accepter `NEW` laisserait croire à un retour arrière que la persistance ne sait pas exprimer. Renseigne `handledAt`."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID de la demande de prière (jamais un slug)."
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - PRAYED
              required:
                - status
              additionalProperties: false
      responses:
        "200":
          description: "Demande marquée comme portée."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PrayerRequest"
        "400":
          description: "`VALIDATION_ERROR` — corps non conforme : clé inconnue, champ `status` absent, ou valeur autre que la chaîne littérale `PRAYED`."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`PRAYER_REQUEST_NOT_FOUND` — cette demande de prière est introuvable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    delete:
      operationId: prayerRequestsDelete
      tags:
        - "prayer-requests"
      summary: "Supprimer une demande de prière"
      description: "Administration. Suppression définitive."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID de la demande de prière (jamais un slug)."
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Demande supprimée : corps vide."
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`PRAYER_REQUEST_NOT_FOUND` — cette demande de prière est introuvable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/me":
    get:
      operationId: adminMe
      tags:
        - admin
      summary: "Profil de l'administrateur connecté"
      description: "Exige seulement d'être un **administrateur actif** (jeton valide + profil `admin_profiles` présent et `isActive`), sans rôle supplémentaire : c'est l'appel par lequel l'interface sait qui est connecté. Aucun identifiant n'est reçu — le profil est déduit du jeton vérifié, jamais d'un paramètre d'URL, ce qui interdit de lire le profil d'un autre administrateur."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Profil courant."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProfile"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/profiles":
    get:
      operationId: adminProfilesList
      tags:
        - admin
      summary: "Lister les profils administratifs"
      description: "Annuaire administratif, avec l'état d'activation, la date de création et l'adresse de connexion de chaque profil. Collection paginée, sans filtre serveur.\n\n**Cellule 1.4 — arbitrée** : ouverte au `SUPER_ADMIN` **et à l'`ADMIN`** (Q-02 tranchée par le commanditaire). Lire l'annuaire n'autorise pas à administrer les comptes qu'on y trouve : les cellules 1.5 et 1.6 restent bornées aux responsables de département pour un acteur `ADMIN`, et XD-03 lui interdit toute action contre un `SUPER_ADMIN`."
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Collection paginée de profils."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProfileCollection"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/users":
    post:
      operationId: adminUsersCreate
      tags:
        - admin
      summary: "Créer un compte d'administration"
      description: "Crée le compte d'authentification puis son habilitation, et **compense** — en supprimant le compte d'authentification — si l'écriture du profil échoue : on ne laisse pas derrière soi un utilisateur capable de s'authentifier et dépourvu de tout droit. Le mot de passe n'est jamais renvoyé. `409 DUPLICATE_EMAIL` si l'adresse est déjà enregistrée ; `403` si le rôle demandé est hors du pouvoir de l'appelant."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: "Compte créé."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProfileSummary"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/users/{id}/authorization":
    patch:
      operationId: adminUsersUpdateAuthorization
      tags:
        - admin
      summary: "Réécrire l'habilitation d'un compte"
      description: "Rôle, périmètre et rattachement.\n\n**Cellule 1.5 — arbitrée** : ouverte au `SUPER_ADMIN` **et, pour les responsables de département seulement, à l'`ADMIN`** (Q-02 tranchée). Pour un acteur `ADMIN` : la cible doit être un `DEPARTMENT_MANAGER` et le rôle écrit doit rester `DEPARTMENT_MANAGER` — promouvoir vers un rôle qu'il ne détient pas serait s'attribuer un pouvoir par personne interposée (D-03, D-04). Administrer un compte `SUPER_ADMIN` reste refusé à tous (XD-03, Q-03)."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "Identifiant `admin_profiles.id` du compte visé."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AdminUserAuthorization"
      responses:
        "200":
          description: "Habilitation mise à jour."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProfileSummary"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/users/{id}/activation":
    patch:
      operationId: adminUsersSetActivation
      tags:
        - admin
      summary: "Désactiver ou réactiver un compte"
      description: "La révocation est **immédiate** (D-14) : le profil est mis à jour avant le fournisseur d'identité, parce que c'est `is_active` que la chaîne d'accès relit à chaque requête — donc ce qui invalide les jetons déjà émis. Une désactivation ne touche pas au rôle : réactiver rend le compte tel qu'il était.\n\n**Cellule 1.6 — arbitrée** : ouverte au `SUPER_ADMIN` **et, pour les responsables de département seulement, à l'`ADMIN`** (Q-A4 tranchée). Personne ne désactive son propre compte : ce serait un verrouillage. Pour supprimer définitivement un compte, voir `DELETE /admin/users/{id}`."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "Identifiant `admin_profiles.id` du compte visé."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AdminUserActivation"
      responses:
        "200":
          description: "État du compte mis à jour."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProfileSummary"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/users/{id}":
    delete:
      operationId: adminUsersDelete
      tags:
        - admin
      summary: "Supprimer définitivement un compte"
      description: "**Suppression physique et irréversible** du profil et du compte d'authentification — à ne pas confondre avec la désactivation.\n\n**Cellule 1.8 — arbitrée** : réservée au **`SUPER_ADMIN`** (Q-24 tranchée par le commanditaire). Trois bornes s'appliquent : aucun compte `SUPER_ADMIN` ne peut être supprimé (Q-03 — le dernier accès d'administration est donc protégé), personne ne supprime son propre compte, et un compte encore **auteur de droits d'accès média** ne peut pas disparaître (`media_access.granted_by` est en `RESTRICT`) : la réponse est alors `409`, avec la consigne de retirer ces autorisations.\n\nOrdre des écritures : profil d'abord, compte d'authentification ensuite. Si la seconde échoue, la réponse le dit explicitement — le compte subsistant ne peut plus rien faire (aucun profil, donc aucun droit)."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "Identifiant `admin_profiles.id` du compte visé."
      responses:
        "204":
          description: "Compte supprimé. Aucun corps."
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/users/{id}/identity":
    patch:
      operationId: adminUsersUpdateIdentity
      tags:
        - admin
      summary: "Corriger l'identité d'un compte"
      description: "Nom d'utilisateur, nom affiché et adresse de connexion. **Aucune cellule de `docs/029` §2.1** ne couvre cette opération : l'hypothèse retenue est la plus restrictive cohérente (alignée sur la cellule 1.5, donc `SUPER_ADMIN`), déclarée `pending` dans `UserPolicy`. Les exclusions existantes s'appliquent — XD-03 (un `ADMIN` n'administre pas un `SUPER_ADMIN`) et Q-03 (un `SUPER_ADMIN` n'administre pas un pair).\n\nL'adresse est écrite **avant** l'identité applicative : le fournisseur est seul à pouvoir refuser pour un motif métier (adresse déjà prise). En cas d'échec de la seconde écriture, la réponse **le dit** — l'adresse a changé, le profil non."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "Identifiant `admin_profiles.id` du compte visé."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AdminUserIdentity"
      responses:
        "200":
          description: "Profil mis à jour."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminProfileSummary"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/users/{id}/password":
    patch:
      operationId: adminUsersSetPassword
      tags:
        - admin
      summary: "Réinitialiser le mot de passe d'un compte"
      description: "Réinitialisation **administrative** : aucun courriel n'est envoyé, la valeur est transmise par HTTPS au backend puis à l'API d'administration Supabase, qui l'empreinte. Aucun hachage n'est calculé par l'application, et le secret ne figure ni dans une réponse, ni dans un journal, ni en base. Réponse `204` sans corps.\n\nLes sessions déjà ouvertes ne sont **pas** révoquées : un jeton reste valide jusqu'à expiration. Pour couper un accès immédiatement, utilisez la désactivation."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "Identifiant `admin_profiles.id` du compte visé."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AdminUserPassword"
      responses:
        "204":
          description: "Mot de passe redéfini. Aucun corps."
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/admin/me/password":
    patch:
      operationId: adminChangeOwnPassword
      tags:
        - admin
      summary: "Changer son propre mot de passe"
      description: "Aucun identifiant n'est reçu : la cible est l'identité du **jeton vérifié**. Volontairement hors de `UserPolicy` — administrer son propre secret n'est pas administrer autrui — et indispensable : Q-03 interdit à un `SUPER_ADMIN` d'administrer un compte `SUPER_ADMIN`, y compris le sien, ce qui laisserait le compte suprême sans moyen de faire tourner son mot de passe. La garde reste réelle : administrateur **actif**. Réponse `204` sans corps."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
