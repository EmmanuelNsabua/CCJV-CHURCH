    UploadMediaRequest:
      type: object
      description: "Formulaire de téléversement : un fichier unique sous le nom de champ `file`, un dossier de destination `folder`, et un texte alternatif facultatif `alt`."
      required:
        - file
        - folder
      properties:
        file:
          type: string
          format: binary
          description: "Fichier binaire, un seul. Limite `MAX_UPLOAD_BYTES` (5 Mio par défaut) ; le type réel est déduit des octets, jamais du `Content-Type` ni du nom."
        folder:
          type: string
          enum:
            - events
            - departments
            - publications
            - leaders
            - testimonies
            - community
            - pages
            - resources
          description: "Dossier de destination dans le bucket. Liste fermée : un dossier hors de cette liste produit un 400, il ne vient jamais d'une chaîne libre."
        alt:
          type: string
          maxLength: 300
          description: "Texte alternatif (accessibilité WCAG 2.2 AA), facultatif."
    ValidationIssue:
      type: object
      description: "Un champ fautif tel que produit par `middlewares/validate.ts` et par le traducteur d'erreurs."
      required:
        - champ
        - message
      properties:
        champ:
          type: string
          description: "Chemin du champ fautif, en notation pointée ; `(racine)` pour le corps entier."
        message:
          type: string
          description: "Message de Zod, en français."
  responses:
    ValidationError:
      description: "`VALIDATION_ERROR` — données invalides. Le `details` est un tableau `{ champ, message }` produit par le middleware `validate` (ou par Zod en dernier recours). Un paramètre de chemin ou de requête hors bornes, un corps non conforme au schéma ou une clé inconnue produisent cette réponse.\n\n**Paramètres de requête.** Les schémas de *query* sont des objets **stricts** : tout paramètre non reconnu est refusé ici, et jamais ignoré en silence. `GET /departments?nimportequoi=1` produit donc un 400 dont `details` nomme `nimportequoi`, et `?sort=…` est refusé sur les collections qui n'offrent pas de tri (seuls `events` et `publications` en exposent un, à liste blanche).\n\nLa convention ne souffre **aucune** exception : les listes bornées non paginées (`GET /scriptures`, `GET /schedule`, `GET /social-links`) ne reconnaissent aucun paramètre, et les deux routes hors collection `GET /settings` et `GET /pages/{pageKey}` valident elles aussi une *query* vide, par `emptyQuerySchema` — `?nimportequoi=1` y produit donc un 400.\n\nDeux précisions vérifiées à l'exécution :\n- un corps **vide** `{}` n'est refusé que là où le schéma l'impose par un `refine` (« Aucun champ à mettre à jour » : responsables, témoignages, visages, versets, rythme, liens sociaux) ; les mises à jour de départements, d'événements et de publications n'ont pas cette contrainte et acceptent `{}` ;\n- un corps JSON **mal formé** ne produit pas cette réponse : `express.json()` échoue avant `validate`, ce qui donne un `500 INTERNAL_ERROR` (voir `InternalError`)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    AuthenticationRequired:
      description: "`AUTH_REQUIRED` — en-tête `Authorization: Bearer <jeton>` absent, mal formé ou jeton Supabase invalide/expiré."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "`FORBIDDEN` — jeton valide mais compte non administrable : utilisateur absent de `admin_profiles`, compte désactivé (`isActive = false`), ou rôle insuffisant. Le code `UNAUTHENTICATED_ADMIN` est déclaré pour ce cas dans `shared/errors/app-error.ts` mais n'est pas émis par l'implémentation V1, qui répond toujours `FORBIDDEN`."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "`RATE_LIMITED` — limite globale dépassée : 120 requêtes par minute et par IP (`RATE_LIMIT_MAX`, `RATE_LIMIT_WINDOW_MS`, valeurs par défaut de `config/env.ts`), appliquée à toutes les routes sous `/api/v1` sauf `/api/v1/health`. Deux en-têtes au format draft-8 sont émis (`standardHeaders: \"draft-8\"`), sans `X-RateLimit-*` (`legacyHeaders: false`)."
      headers:
        RateLimit:
          description: "Politique, quota restant et secondes avant réinitialisation. Forme relevée sur l'API : `\"120-in-1min\"; r=111; t=59`."
          schema:
            type: string
        "RateLimit-Policy":
          description: "Politique appliquée. Forme relevée sur l'API : `\"120-in-1min\"; q=120; w=60; pk=:…:`. Sur `POST /prayer-requests`, le limiteur dédié de la route écrase cet en-tête avec sa propre politique."
          schema:
            type: string
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimitedPublicWrite:
      description: "`RATE_LIMITED` — limite dédiée à l'écriture publique dépassée : **5 dépôts par heure et par IP** (`prayer-request.routes.ts`). Le message invite à réessayer dans une heure ou à écrire directement à l'équipe. La limite globale (120/minute) s'applique en amont et peut produire la même réponse.\n\nPrécision vérifiée à l'exécution : le compteur décompte **toutes** les requêtes de cette route, y compris celles refusées en `400 VALIDATION_ERROR` — les en-têtes ci-dessous sont donc présents bien avant le 429. Ils accompagnent l'en-tête `RateLimit` du limiteur global."
      headers:
        "RateLimit-Limit":
          schema:
            type: integer
          description: "Quota : 5."
        "RateLimit-Remaining":
          schema:
            type: integer
          description: "Dépôts restants dans la fenêtre (relevé : `2` après trois appels)."
        "RateLimit-Reset":
          schema:
            type: integer
          description: "Secondes avant réinitialisation de la fenêtre (relevé : `3587`)."
        "RateLimit-Policy":
          schema:
            type: string
          description: "Politique du limiteur de la route (relevé : `5;w=3600`)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: "`CONFLICT` — conflit métier. `details` précise la cause (par exemple `{ total, usages }` pour un média encore référencé, `{ key }` pour une clé de verset déjà prise)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    FileTooLarge:
      description: "`FILE_TOO_LARGE` — le fichier dépasse la limite de téléversement. `details: { maxBytes }`. La taille est contrôlée deux fois : par multer (`LIMIT_FILE_SIZE`, traduit en 413) puis par `StorageService`, qui ne fait confiance à aucune métadonnée de la requête."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InvalidFileType:
      description: "`INVALID_FILE_TYPE` — le type **réel** du fichier, déduit de ses octets, n'est pas accepté **pour le dossier visé** : les dossiers d'images (`events`, `departments`, `publications`, `leaders`, `testimonies`, `community`, `pages`) n'acceptent que JPEG, PNG, WEBP et AVIF ; seul `resources` accepte un PDF. Un fichier vide produit la même réponse. `details: { accepted }` contient la liste du dossier demandé."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InternalError:
      description: "`INTERNAL_ERROR` — erreur inattendue : ni `AppError`, ni `ZodError`. En production, le message technique reste dans les journaux serveur (corrélés par `requestId`) et le client ne reçoit qu'un message générique ; hors production, le message d'origine est renvoyé.\n\nCas **vérifié à l'exécution** : un corps JSON mal formé (par exemple `{\"name\": }`) produit cette réponse — et non un `400 VALIDATION_ERROR` — car `express.json()` échoue avant le middleware `validate`. Exemple relevé : `Unexpected token '}', \"{\\\"name\\\": }\" is not valid JSON` hors production."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  parameters: {}
paths:
  "/api/v1/health":
    get:
      operationId: getHealth
      tags:
        - "Système"
      summary: "Contrôle de santé"
      description: "Interroge réellement PostgreSQL (`select 1`). Cette route est montée **avant** le rate limiter global et n'est donc jamais limitée : Railway l'interroge souvent. Elle ne fait pas partie des routers métier et ne suit pas l'enveloppe `{ data, meta }`."
      security: []
      responses:
        "200":
          description: "Service et base disponibles."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HealthStatus"
        "503":
          description: "`database: \"down\"` — la base est injoignable. Aucune erreur applicative `{ error }` n'est produite : la réponse garde la forme du contrôle de santé."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HealthStatus"
  "/api/v1/departments":
