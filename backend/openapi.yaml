openapi: "3.1.0"
info:
  title: "API CCJV — Centre Chrétien Jésus ma Vie"
  version: v1
  description: "API REST Express + TypeScript servant les contenus publics du site et le\nback-office d'administration.\n\n### Préfixe\nToutes les routes métier sont montées sous `/api/v1`. Seul\n`GET /api/v1/health` échappe au rate limiting global. Une URL\ninconnue sous ce préfixe produit `404 NOT_FOUND`, au format d'erreur standard.\n\n### Authentification\nJeton porteur Supabase (`Authorization: Bearer <jeton>`), vérifié par\n`presentation/middlewares/auth.ts`. L'authentification auprès du fournisseur\nd'identité **ne confère aucun droit** : l'utilisateur doit en plus posséder un\nprofil dans `admin_profiles`, actif, puis le **rôle requis par la policy de la\nressource** pour l'action demandée. Chaque opération déclare son exigence :\n`security: []` pour une route publique, `bearerAuth` pour une route\nd'administration.\n\n### Enveloppes de réponse\n- collection : `{ data: [...], meta: { page, limit, total, totalPages } }` ;\n- ressource : la ressource directement, jamais enveloppée ;\n- erreur : `{ error: { code, message, details? } }` — forme unique, y compris\n  pour une erreur non maîtrisée ou une route inconnue.\n\nTrois listes bornées font exception à l'enveloppe de collection et renvoient\n`{ data: [...] }` **sans** `meta`, car elles ne sont pas paginées :\n`GET /scriptures`, `GET /schedule` et `GET /social-links`.\n\nUn corps JSON **mal formé** sort en `500 INTERNAL_ERROR` (et non en 400) :\n`express.json()` échoue avant le middleware `validate`. Comportement vérifié\nsur l'API en fonctionnement.\n\n### Paramètres de requête\nLes schémas de *query* sont des objets **stricts** : tout paramètre non reconnu\nest refusé en `400 VALIDATION_ERROR`, `details` nommant le paramètre fautif —\njamais ignoré en silence. Une faute de frappe côté client devient donc une erreur\nexploitable, et la convention est identique sur **toutes** les routes.\n`?sort=…` n'est reconnu que là où un tri existe réellement (`GET /events`,\n`GET /publications`, en liste blanche de colonnes) ; ailleurs il est refusé,\nl'ordre étant fixé par le serveur. Les listes non paginées `GET /scriptures`,\n`GET /schedule` et `GET /social-links` ne reconnaissent **aucun** paramètre ;\n`GET /settings` et `GET /pages/:pageKey` valident également une *query* vide\n(`emptyQuerySchema`) et déclarent donc, eux aussi, un 400.\n\n### Limites\n- rate limiting global : 120 requêtes par minute et par IP (`RATE_LIMIT_MAX`),\n  soit `429 RATE_LIMITED` ;\n- écriture publique `POST /prayer-requests` : 5 dépôts par heure et par IP ;\n- pagination : `page` ≥ 1 (défaut 1), `limit` 1–100 (défaut 20) ;\n- corps JSON et `urlencoded` : 1 Mo maximum ; téléversement : limite de\n  `MAX_UPLOAD_BYTES` (5 Mio par défaut), type réel du fichier vérifié.\n\n### Source de vérité\nDocument **généré** depuis l'implémentation : `npm run openapi` (script\n`src/presentation/openapi/generate.ts`), qui produit `openapi.json` et\n`openapi.yaml`. Les chemins et méthodes reprennent le montage réel de\n`src/app.ts` et des `*.routes.ts` ; les corps de requête sont les schémas Zod\ndes modules eux-mêmes ; les codes d'erreur sont les 24 valeurs de l'union\n`ErrorCode` de `shared/errors/app-error.ts`."
servers:
  - url: "/"
    description: "Origine courante. Les chemins documentés incluent déjà le préfixe /api/v1 : l'URL effective est donc <origine>/api/v1/…"
  - url: "http://localhost:4000"
    description: "Développement local : `PORT` vaut 4000 par défaut (`config/env.ts`)."
tags:
  - name: "Système"
    description: "Contrôle de santé, hors routers métier et hors rate limiting."
  - name: departments
    description: "Départements de l'église : lecture publique, écriture administration."
  - name: events
    description: "Événements : lecture publique (statut calculé), écriture administration."
  - name: publications
    description: "Médiathèque, actualités, enseignements et ressources, filtrés par `category`. Les brouillons ne sont jamais visibles publiquement."
  - name: leaders
    description: "Responsables : lecture publique, écriture administration."
  - name: testimonies
    description: "Témoignages : lecture publique, écriture administration."
  - name: "community-faces"
    description: "Visages de la communauté : lecture publique, écriture administration."
  - name: scriptures
    description: "Versets identifiés par une clé d'URL. Liste non paginée."
  - name: schedule
    description: "Rythme hebdomadaire. Liste non paginée, sans lecture d'entrée isolée."
  - name: "social-links"
    description: "Réseaux sociaux ordonnés. Liste non paginée ; les liens sont aussi exposés par `GET /settings`."
  - name: settings
    description: "Réglages institutionnels : document unique, clés d'écriture fermées."
  - name: pages
    description: "Contenus éditables des pages statiques, par clé de page."
  - name: media
    description: "Registre des médias téléversés. Entièrement administratif : aucune de ces routes n'est publique."
  - name: teachings
    description: "Enseignements (sermons) : métadonnées, références bibliques et médias. Lecture publique restreinte aux publications ; écriture réservée aux rôles globaux. Chemin documenté : `/enseignements` (alias `/teachings`)."
  - name: resources
    description: "Documents PDF téléchargeables de l'espace Ressources. Lecture publique, écriture réservée aux rôles globaux. Chemin documenté : `/resources` (alias `/ressources`)."
  - name: "prayer-requests"
    description: "Demandes de prière. Dépôt public rate-limité ; toute lecture est réservée à l'administration."
  - name: admin
    description: "Identité administrative et annuaire des profils. Aucune route publique."
security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Jeton d'accès Supabase (`Authorization: Bearer <jeton>`), vérifié par `presentation/middlewares/auth.ts` (`verifyAccessToken`). Le jeton identifie l'utilisateur auprès du fournisseur d'identité ; il ne confère aucun droit à lui seul : `requireAdmin` charge ensuite le profil `admin_profiles` et exige qu'il existe et qu'il soit actif, puis la **policy de la ressource** décide de l'action (rôle, périmètre, égalité départementale, état de la ressource)."
  schemas:
    AdminProfile:
      type: object
      description: "Profil administratif courant (`admin.serializer.ts`). Aucune information d'authentification : ni jeton, ni secret, ni adresse d'authentification."
      required:
        - id
        - username
        - displayName
        - role
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - ADMIN
            - DEPARTMENT_MANAGER
    AdminProfileCollection:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/AdminProfileSummary"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    AdminProfileSummary:
      type: object
      description: "Entrée de l'annuaire administratif : le profil courant complété de l'état d'activation, de la date de création et de l'adresse de connexion."
      required:
        - id
        - username
        - displayName
        - role
        - isActive
        - createdAt
        - email
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - ADMIN
            - DEPARTMENT_MANAGER
        isActive:
          type: boolean
        createdAt:
          type: string
          format: "date-time"
        email:
          type:
            - string
            - "null"
          format: email
    AdminUserActivation:
      type: object
      description: "Activation ou désactivation (cellule 1.6). `isActive` porte le sens : désactiver et réactiver sont la **même** habilitation, et une route par direction laisserait croire à deux droits distincts."
      required:
        - isActive
      properties:
        isActive:
          type: boolean
    AdminUserAuthorization:
      type: object
      description: "Réécriture complète d'une habilitation (cellule 1.5). Les trois champs sont obligatoires : la contrainte de cohérence `admin_profiles_scope_coherence` porte sur le **triplet**, et accepter une modification partielle obligerait à relire l'état courant — donc à écrire depuis un état périmé."
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - ADMIN
            - DEPARTMENT_MANAGER
        departmentId:
          type:
            - string
            - "null"
          format: uuid
    AdminUserCreate:
      type: object
      description: "Création d'un compte et de son habilitation (`docs/023` §6). Le rôle demandé choisit la règle appliquée : un `ADMIN` peut créer un responsable et **rien d'autre** (D-04) — demander un compte `ADMIN` ou `SUPER_ADMIN` produit un `403`, exactement comme le décrit la séquence « opération interdite » de `docs/023` §6. Le département est obligatoire pour un responsable et refusé pour un rôle système (D-02, `docs/032` §3.1)."
      required:
        - email
        - username
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          minLength: 3
          maxLength: 50
        displayName:
          type:
            - string
            - "null"
          maxLength: 120
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - ADMIN
            - DEPARTMENT_MANAGER
        departmentId:
          type:
            - string
            - "null"
          format: uuid
          description: "Obligatoire pour `DEPARTMENT_MANAGER`, interdit sinon."
        password:
          type: string
          minLength: 12
          description: "Mot de passe **provisoire**, facultatif. S'il est omis, le serveur en génère un — qui n'est **jamais** renvoyé par l'API dans les deux cas. Aucun document n'arrête la remise du premier identifiant : c'est un point ouvert."
    AdminUserIdentity:
      type: object
      description: "Correction de l'identité d'un compte. `username` et `displayName` vivent dans `admin_profiles`, `email` chez le fournisseur d'identité — deux écritures, deux autorités, donc **aucune transaction commune**. Au moins un champ est exigé : une requête vide n'est pas une modification. Le rôle et le périmètre ne figurent pas ici (cellule 1.5, autre permission)."
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        displayName:
          type:
            - string
            - "null"
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
    AdminUserPassword:
      type: object
      description: "Nouveau mot de passe. La valeur traverse le serveur **sans y être lue, journalisée, stockée ni renvoyée** : elle part vers l'API d'administration Supabase, qui l'empreinte elle-même. Aucun algorithme de hachage n'existe dans le projet, et la réponse est un `204` sans corps."
      required:
        - password
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 200
          description: "12 caractères au minimum (borne basse de `docs/030` §5). La politique de complexité reste celle de Supabase : le fournisseur arbitre le refus."
    BiblicalReference:
      type: object
      description: "Référence biblique d'un enseignement (`teaching.serializer.ts`). `endChapter` et `endVerse` valent `null` pour un verset isolé. `formatted` est calculé par le serveur : le client n'a pas à recomposer « Jean 3:16 » lui-même."
      required:
        - id
        - book
        - startChapter
        - startVerse
        - endChapter
        - endVerse
        - position
        - formatted
      properties:
        id:
          type: string
          format: uuid
        book:
          type: string
        startChapter:
          type: integer
          minimum: 1
        startVerse:
          type: integer
          minimum: 1
        endChapter:
          type:
            - integer
            - "null"
          minimum: 1
        endVerse:
          type:
            - integer
            - "null"
          minimum: 1
        position:
          type: integer
        formatted:
          type: string
          description: "Ex. `Jean 3:16`, `Psaume 23:1–6`, `Romains 8:1–11:36`."
    BiblicalReferenceCollection:
      type: array
      description: "Réponse de `PUT /enseignements/{id}/references-bibliques` : la liste **relue depuis la base**, pas l'écho du corps envoyé."
      items:
        "$ref": "#/components/schemas/BiblicalReference"
    CommunityFace:
      type: object
      description: "Visage de la communauté (`community-face.serializer.ts`) : `name` ← `personName`."
      required:
        - id
        - photo
        - name
        - caption
        - position
      properties:
        id:
          type: string
          format: uuid
        photo:
          type:
            - string
            - "null"
        name:
          type: string
        caption:
          type: string
        position:
          type: integer
          minimum: 0
    CommunityFaceCollection:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/CommunityFace"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    Department:
      type: object
      description: "Département (`department.serializer.ts`). Les champs facultatifs sont **omis** lorsqu'ils sont nuls, jamais émis à `null`."
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        responsibleName:
          type: string
        bannerImage:
          type: string
          description: "URL publique résolue du média de bandeau."
        meetingSchedule:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        gallery:
          type: array
          items:
            type: string
          description: "URLs publiques ; omis lorsque la galerie est vide."
        tagline:
          type: string
    DepartmentActivity:
      type: object
      description: "Activité d'un département (`department.serializer.ts` → `activities`). Les champs facultatifs sont **omis** lorsqu'ils sont nuls."
      required:
        - id
        - title
        - position
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        imageMediaId:
          type: string
          format: uuid
        imageUrl:
          type: string
          description: "URL publique résolue du média de l'activité."
        position:
          type: integer
          minimum: 0
    DepartmentActivityCollection:
      type: object
      description: "Réponse de `PUT /departments/{idOrSlug}/activities` : la collection **relue depuis la base**, jamais l'écho du corps envoyé."
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/DepartmentActivity"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    DepartmentArchive:
      type: object
      description: "Archive d'un département supprimé (`departmentArchives`). `snapshot` est l'instantané complet de la fiche au moment de la suppression, transmis tel quel."
      required:
        - id
        - originalDepartmentId
        - name
        - slug
        - snapshot
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        originalDepartmentId:
          type: string
          format: uuid
          description: "`id` du département supprimé ; il n'existe plus dans `departments`."
        name:
          type: string
        slug:
          type: string
        snapshot:
          type: object
          additionalProperties: true
          description: "Fiche complète au moment de la suppression : champs, activités, responsables et références de médias."
        archivedBy:
          type:
            - string
            - "null"
          format: uuid
          description: "Auteur de la suppression, `null` si l'information n'était pas fournie."
        archivedAt:
          type: string
          format: "date-time"
        reason:
          type:
            - string
            - "null"
    DepartmentArchiveCollection:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/DepartmentArchive"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    DepartmentCollection:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Department"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    ErrorResponse:
      type: object
      description: "Enveloppe d'erreur unique de l'API. Toute erreur, y compris non maîtrisée, sort sous cette forme (`shared/http/respond.ts`, `presentation/middlewares/error-handler.ts`)."
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: "Code métier. Liste fermée des 24 codes de `shared/errors/app-error.ts`."
              enum:
                - AUTH_REQUIRED
                - FORBIDDEN
                - UNAUTHENTICATED_ADMIN
                - VALIDATION_ERROR
                - EVENT_NOT_FOUND
                - DEPARTMENT_NOT_FOUND
                - PUBLICATION_NOT_FOUND
                - PAGE_NOT_FOUND
                - LEADER_NOT_FOUND
                - TESTIMONY_NOT_FOUND
                - COMMUNITY_FACE_NOT_FOUND
                - SCRIPTURE_NOT_FOUND
                - SCHEDULE_ENTRY_NOT_FOUND
                - SOCIAL_LINK_NOT_FOUND
                - PRAYER_REQUEST_NOT_FOUND
                - MEDIA_NOT_FOUND
                - MEDIA_ACCESS_NOT_FOUND
                - SETTING_NOT_FOUND
                - NOTIFICATION_NOT_FOUND
                - PROFILE_NOT_FOUND
                - RESOURCE_NOT_FOUND
                - DUPLICATE_SLUG
                - DUPLICATE_EMAIL
                - CONFLICT
                - FILE_TOO_LARGE
                - INVALID_FILE_TYPE
                - RATE_LIMITED
                - NOT_FOUND
                - INTERNAL_ERROR
            message:
              type: string
              description: "Message lisible. En production, un message non exposable est remplacé par « Une erreur interne est survenue »."
            details:
              description: "Précisions exploitables, présent uniquement lorsque l'erreur en porte. Tableau `{ champ, message }` pour `VALIDATION_ERROR`, objet libre sinon (par exemple `{ slug }`, `{ maxBytes }`, `{ accepted }`, `{ key }`, `{ total, usages }`)."
              oneOf:
                - type: array
                  items:
                    "$ref": "#/components/schemas/ValidationIssue"
                  description: "Détail d'une erreur de validation Zod."
                - type: object
                  additionalProperties: true
                  description: "Détail propre au code d'erreur."
    Event:
      type: object
      description: "Événement (`event.serializer.ts`). `eventDate` est une chaîne `AAAA-MM-JJ` et `eventTime` une chaîne `HH:MM` : jamais d'objet `Date`, pour éviter tout décalage de fuseau entre le serveur et Lubumbashi. `status` est **calculé** depuis `eventDate`, jamais stocké."
      required:
        - id
        - title
        - slug
        - eventDate
        - departmentId
        - status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date
        eventTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        location:
          type: string
        imageUrl:
          type: string
        departmentId:
          type:
            - string
            - "null"
          format: uuid
          description: "`null` = événement général de l'église. Toujours présent, y compris à `null`."
        status:
          type: string
          enum:
            - UPCOMING
            - ARCHIVED
          description: "`UPCOMING` si `eventDate` ≥ aujourd'hui, sinon `ARCHIVED`."
        excerpt:
          type: string
        bannerImage:
          type: string
        gallery:
          type: array
          items:
            type: string
        practicalInfo:
          type: array
          items:
            type: string
    EventCollection:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Event"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    HealthStatus:
      type: object
      description: "État du service. Le contrôle interroge réellement PostgreSQL : un conteneur qui répond « ok » alors que la base est injoignable serait un faux positif."
      required:
        - status
        - version
        - environment
        - database
      properties:
        status:
          type: string
          enum:
            - ok
            - error
        version:
          type: string
          description: "Valeur de `API_VERSION` (préfixe des routes)."
        environment:
          type: string
          enum:
            - development
            - test
            - production
        database:
          type: string
          enum:
            - up
            - down
    Leader:
      type: object
      description: "Responsable (`leader.serializer.ts`). Tous les champs sont toujours présents : `scope`, `bio`, `photo` et `departmentId` valent `null` lorsqu'ils sont vides."
      required:
        - id
        - name
        - role
        - scope
        - bio
        - photo
        - departmentId
        - position
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        scope:
          type:
            - string
            - "null"
        bio:
          type:
            - string
            - "null"
        photo:
          type:
            - string
            - "null"
          description: "URL publique du portrait."
        departmentId:
          type:
            - string
            - "null"
          format: uuid
        position:
          type: integer
          minimum: 0
    LeaderCollection:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Leader"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    Media:
      type: object
      description: "Média (`media.serializer.ts`). `mimeType` est déduit des **octets** du fichier, jamais du `Content-Type` ni du nom de fichier envoyés par le client."
      required:
        - id
        - url
        - bucket
        - path
        - folder
        - mimeType
        - sizeBytes
        - width
        - height
        - alt
        - uploadedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: "URL publique du fichier."
        bucket:
          type: string
        path:
          type: string
          description: "Chemin interne, généré par le serveur."
        folder:
          type:
            - string
            - "null"
          enum:
            - events
            - departments
            - publications
            - leaders
            - testimonies
            - community
            - pages
            - resources
            - null
          description: "Premier segment du chemin, ou `null`."
        mimeType:
          type: string
          description: "Types acceptés : image/jpeg, image/png, image/webp, image/gif."
        sizeBytes:
          type: integer
          minimum: 0
        width:
          type:
            - integer
            - "null"
          minimum: 0
        height:
          type:
            - integer
            - "null"
          minimum: 0
        alt:
          type:
            - string
            - "null"
          description: "Texte alternatif, requis pour l'accessibilité (WCAG 2.2 AA)."
        uploadedBy:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: "date-time"
    MediaAccess:
      type: object
      description: "Droits d'accès d'un média (`docs/032` §3.4). Les **trois droits sont indépendants** : `canManage` n'implique pas `canUse`, et `canDelete` ne se déduit d'aucun autre (D-21). Tous les booléens sont toujours présents, y compris `false` — un objet qui omettrait un droit inviterait à le déduire."
      required:
        - id
        - mediaId
        - granteeType
        - granteeId
        - canUse
        - canManage
        - canDelete
        - grantedBy
        - grantedAt
      properties:
        id:
          type: string
          format: uuid
        mediaId:
          type: string
          format: uuid
        granteeType:
          type: string
          enum:
            - DEPARTMENT
            - ADMIN_PROFILE
        granteeId:
          type: string
          format: uuid
        canUse:
          type: boolean
          description: "Référencer le média dans un contenu."
        canManage:
          type: boolean
          description: "Modifier la ressource média."
        canDelete:
          type: boolean
          description: "Jamais accordé à un département (XD-07)."
        grantedBy:
          type: string
          format: uuid
          description: "Auteur du grant — la preuve de qui a autorisé quoi (`docs/029` §2.6)."
        grantedAt:
          type: string
          format: "date-time"
        updatedAt:
          type: string
          format: "date-time"
    MediaAccessGrant:
      type: object
      description: "Corps d'un accord de droits. Un accès qui n'accorde **rien** est refusé (400 en validation, et `media_access_at_least_one_right` en base), et un département ne peut **jamais** recevoir `DELETE` (XD-07) — le schéma comme la base le refusent, avec le même effet."
      required:
        - granteeType
        - granteeId
      properties:
        granteeType:
          type: string
          enum:
            - DEPARTMENT
            - ADMIN_PROFILE
        granteeId:
          type: string
          format: uuid
        canUse:
          type: boolean
          default: false
        canManage:
          type: boolean
          default: false
        canDelete:
          type: boolean
          default: false
    MediaCollection:
