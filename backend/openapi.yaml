  "/api/v1/enseignements":
    get:
      operationId: teachingsList
      tags:
        - teachings
      summary: "Lister les enseignements"
      description: "Collection paginée, ouverte. **Alias** : `GET /teachings` (même controller).\n\nUn jeton d'administration valide dans `Authorization` élargit la lecture aux brouillons et aux archives ; sans jeton, seuls les enseignements `PUBLISHED` sortent. Le jeton est **facultatif** ici : son absence n'est pas une erreur, elle restreint.\n\n`status` et `search` sont les seuls filtres reconnus, et la *query* est stricte : tout autre paramètre — `?sort=…` compris — est refusé en `400 VALIDATION_ERROR`."
      security: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: "Ne renvoyer que les enseignements dans cet état. Un demandeur non administrateur n'obtient de toute façon que les `PUBLISHED`.\n\n`ARCHIVED` correspond à un enseignement retiré du public mais conservé."
          schema:
            type: string
            enum:
              - DRAFT
              - PUBLISHED
              - ARCHIVED
        - name: search
          in: query
          required: false
          description: "Recherche textuelle sur le titre et le nom de l'orateur (insensible à la casse)."
          schema:
            type: string
      responses:
        "200":
          description: "Enseignements correspondants."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TeachingCollection"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      operationId: teachingsCreate
      tags:
        - teachings
      summary: "Créer un enseignement"
      description: "Administration (`SUPER_ADMIN`, `ADMIN` — `TeachingPolicy`). Créé en `DRAFT` par défaut : la publication est une transition distincte (`POST /{id}/publish`), qui exige au moins un média.\n\n`slug` est facultatif. S'il est omis, il est dérivé du titre ; s'il est déjà pris, il est **suffixé** (`-2`, `-3`…) : deux enseignements peuvent porter le même titre, seule l'adresse publique est rendue unique."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                slug:
                  type: string
                  maxLength: 220
                speakerName:
                  type: string
                  minLength: 1
                  maxLength: 150
                preachedAt:
                  type: string
                  pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                summary:
                  type:
                    - string
                    - "null"
                  maxLength: 1000
                description:
                  type:
                    - string
                    - "null"
                status:
                  type: string
                  enum:
                    - DRAFT
                    - PUBLISHED
                    - ARCHIVED
              required:
                - title
                - speakerName
                - preachedAt
      responses:
        "201":
          description: "Enseignement créé, en brouillon."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Teaching"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/enseignements/{id}":
