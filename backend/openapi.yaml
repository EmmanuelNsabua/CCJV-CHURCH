      description: "Collection paginée, ordonnée par `position` côté serveur. Aucun filtre métier en V1 : seuls `page` et `limit` sont acceptés. Aucun tri n'est exposé, donc `?sort=…` est refusé en `400 VALIDATION_ERROR` — comme tout autre paramètre non reconnu."
      security: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Collection paginée."
          content:
