                  pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
                eventTime:
                  type:
                    - string
                    - "null"
                  pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
                endTime:
                  type:
                    - string
                    - "null"
                  pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$"
                location:
                  type:
                    - string
                    - "null"
                  maxLength: 150
                imageMediaId:
                  type:
                    - string
                    - "null"
                  format: uuid
                bannerMediaId:
                  type:
                    - string
                    - "null"
                  format: uuid
                status:
                  type: string
                  enum:
                    - DRAFT
                    - PUBLISHED
                    - CANCELLED
                departmentId:
                  type:
                    - string
                    - "null"
                  format: uuid
                visibilityScope:
                  type: string
                  enum:
                    - DEPARTMENT
                    - GLOBAL
                practicalInfo:
                  type:
                    - array
                    - "null"
                  items:
                    type: string
                    minLength: 1
                    maxLength: 300
                  maxItems: 20
                galleryMediaIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 60
                slug:
                  type: string
                  minLength: 2
                  maxLength: 180
              required:
                - title
      responses:
        "201":
          description: "Ressource créée."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Event"
        "400":
          "$ref": "#/components/responses/ValidationError"
