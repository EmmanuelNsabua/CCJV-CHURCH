        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      operationId: mediaUpload
      tags:
        - media
      summary: "Téléverser un média"
      description: "Administration. Corps `multipart/form-data` : un champ fichier `file` et un champ texte `folder`, plus un `alt` facultatif.\n\nLe téléversement est fait **en mémoire** (`multer.memoryStorage()`) : rien n'est jamais écrit sur le disque du serveur, éphémère sur l'hébergement. Type et taille sont contrôlés par `StorageService` à partir des **octets** du fichier — jamais du `Content-Type` ni du nom de fichier envoyés par le client — et le nom du fichier stocké est généré par le serveur (UUID + extension), ce qui élimine les traversées de chemin et les collisions.\n\nLes types acceptés dépendent du **dossier** : `resources` n'accepte que des PDF (documents téléchargeables de l'espace Ressources, jusqu'à 20 Mo) ; tous les autres dossiers n'acceptent que des images, plafonnées à 5 Mo. Un PDF envoyé dans un dossier d'images — ou une photo envoyée dans `resources` — est refusé en `415`."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              "$ref": "#/components/schemas/UploadMediaRequest"
      responses:
        "201":
          description: "Média téléversé et enregistré."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Media"
        "400":
          description: "`VALIDATION_ERROR` — champ `folder` absent ou hors de la liste autorisée, `alt` trop long, aucun fichier reçu sous le nom de champ `file` (« Aucun fichier reçu : le champ de formulaire « file » est requis »), ou plusieurs fichiers envoyés. `details` indique le champ fautif."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/FileTooLarge"
        "415":
          "$ref": "#/components/responses/InvalidFileType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
