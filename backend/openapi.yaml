    post:
      operationId: scripturesCreate
      tags:
        - scriptures
      summary: "Créer un verset"
      description: "Administration. `key` est unique : le service détecte le conflit **avant** l'écriture pour renvoyer une erreur métier plutôt qu'une violation de contrainte SQL. `translation` vaut « Louis Segond 1910 » par défaut."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 60
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                reference:
                  type: string
                  minLength: 1
                  maxLength: 80
                translation:
                  type: string
                  minLength: 1
                  maxLength: 80
                  default: "Louis Segond 1910"
                context:
                  type:
                    - string
                    - "null"
                  maxLength: 200
              required:
                - key
                - text
                - reference
      responses:
        "201":
          description: "Verset créé."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Scripture"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
