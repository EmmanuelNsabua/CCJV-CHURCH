      tags:
        - media
      summary: "Modifier les droits d'un destinataire"
      description: "Réécrit les trois droits d'une ligne existante (cellule 6.3). `SUPER_ADMIN` ou `ADMIN` uniquement : modifier un droit est la même opération qu'en accorder un, à une ligne près. Les trois droits sont **remplacés**, jamais fusionnés : une modification partielle obligerait à relire l'état courant, donc à écrire depuis un état périmé."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID du média."
          schema:
            type: string
            format: uuid
        - name: granteeType
          in: path
          required: true
          description: "Type de destinataire : un département, ou un profil nommément désigné."
          schema:
            type: string
            enum:
              - DEPARTMENT
              - ADMIN_PROFILE
        - name: granteeId
          in: path
          required: true
          description: "Identifiant du destinataire (`departments.id` ou `admin_profiles.id`, selon `granteeType`)."
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MediaRights"
      responses:
        "200":
          description: "Droits mis à jour."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MediaAccess"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`MEDIA_NOT_FOUND` ou `MEDIA_ACCESS_NOT_FOUND` — le média, ou la ligne de droits de ce destinataire, n'existe pas."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "`CONFLICT` — règle refusée par la base (XD-07, ligne vide)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    delete:
      operationId: mediaAccessRevoke
      tags:
        - media
      summary: "Retirer un accès"
      description: "Le retrait **supprime la ligne** au lieu de mettre les trois droits à `false` : « l'autorisation se retire par `DELETE` » (`docs/029` §2.6), et une ligne vide est de toute façon interdite par la base. `SUPER_ADMIN` ou `ADMIN` uniquement."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID du média."
          schema:
            type: string
            format: uuid
        - name: granteeType
          in: path
          required: true
          description: "Type de destinataire : un département, ou un profil nommément désigné."
          schema:
            type: string
            enum:
              - DEPARTMENT
              - ADMIN_PROFILE
        - name: granteeId
          in: path
          required: true
          description: "Identifiant du destinataire (`departments.id` ou `admin_profiles.id`, selon `granteeType`)."
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Accès retiré : corps vide."
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`MEDIA_NOT_FOUND` ou `MEDIA_ACCESS_NOT_FOUND` — il n'y a aucun droit à retirer."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/notifications":
    get:
      operationId: notificationsList
      tags:
        - notifications
      summary: "Boîte de réception de l'appelant"
      description: "Les notifications **du profil authentifié**, les plus récentes d'abord. Aucun paramètre ne permet de demander la boîte d'un autre : le destinataire est toujours `req.admin.id`. Le domaine des notifications est réservé à l'`ADMIN` — D-10 le ferme entièrement au `SUPER_ADMIN`, cycle de vie des clés compris (`docs/030` §4.7, §6.2), et le responsable n'y a aucune part."
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: unreadOnly
          in: query
          required: false
          description: "`true` pour ne rendre que les notifications non lues. Seules les chaînes `true` et `false` sont acceptées — `Boolean(\"false\")` vaut `true`."
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
      responses:
        "200":
          description: "Collection paginée de notifications."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/NotificationCollection"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/notifications/unread-count":
    get:
      operationId: notificationsUnreadCount
      tags:
        - notifications
      summary: "Nombre de notifications non lues"
      description: "Indicateur de la barre de navigation. Aucune requête de *query* n'est reconnue (objet strict) : un `?nimportequoi=1` est refusé en `400 VALIDATION_ERROR` plutôt qu'ignoré."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Compteur."
          content:
            "application/json":
              schema:
                type: object
                required:
                  - unread
                properties:
                  unread:
                    type: integer
                    minimum: 0
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/notifications/{id}/read":
    patch:
      operationId: notificationsMarkRead
      tags:
        - notifications
      summary: "Marquer une notification comme lue"
      description: "**Idempotent** : marquer une notification déjà lue renvoie `200` sans rien changer — rejouer un marquage n'est pas une faute. Une notification appartenant à un autre produit le **même `404`** qu'une notification inexistante : distinguer `403` et `404` révélerait l'existence d'une donnée adressée à quelqu'un d'autre (`docs/029` §4.5, règles de non-fuite)."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID de la notification."
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Notification marquée comme lue."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Notification"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`NOTIFICATION_NOT_FOUND` — aucune notification ne correspond à cet identifiant **ou** elle appartient à un autre destinataire."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/prayer-requests":
    post:
      operationId: prayerRequestsSubmit
      tags:
        - "prayer-requests"
      summary: "Déposer une demande de prière"
      description: "**Route publique** : c'est le seul point d'écriture ouvert à un visiteur non authentifié. Le corps est un objet **strict** : toute clé inconnue provoque un 400 plutôt que d'être ignorée, et un champ non prévu ne peut pas être injecté dans la ligne.\n\nLa route est **rate-limitée à 5 dépôts par heure et par IP** (`prayer-request.routes.ts`), en plus de la limite globale. Le compteur est indexé sur l'adresse IP réelle (`trust proxy` activé pour Railway).\n\nLa réponse est volontairement minimale : ni le texte de l'intention, ni le prénom, ni le contact ne sont renvoyés — ces données personnelles sensibles ne circulent pas une seconde fois."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                requestText:
                  type: string
                  minLength: 1
                  maxLength: 1000
                requesterName:
                  type: string
                  maxLength: 120
                requesterContact:
                  type: string
                  maxLength: 120
                confidentiality:
                  type: string
                  enum:
                    - private
                    - community
                  default: private
              required:
                - requestText
              additionalProperties: false
      responses:
        "201":
          description: "Demande enregistrée."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PrayerRequestCreated"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimitedPublicWrite"
        "500":
          "$ref": "#/components/responses/InternalError"
    get:
      operationId: prayerRequestsList
      tags:
        - "prayer-requests"
      summary: "Lister les demandes de prière"
      description: "**Administration uniquement.** Lecture jamais publique : le formulaire affirme au visiteur que sa demande « ne sera jamais publiée sur Internet ni sur les réseaux sociaux ». Ordre fixé par le serveur (date décroissante) ; aucun paramètre de tri n'existe."
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: "Filtrer par état. Omis ⇒ toutes les demandes."
          schema:
            type: string
            enum:
              - NEW
              - PRAYED
      responses:
        "200":
          description: "Collection paginée de demandes."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PrayerRequestCollection"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/prayer-requests/{id}":
    get:
      operationId: prayerRequestsGet
      tags:
        - "prayer-requests"
      summary: "Lire une demande de prière"
      description: "Administration. Le message d'erreur est volontairement identique quelle que soit la cause : rien à deviner pour un appelant non autorisé."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
