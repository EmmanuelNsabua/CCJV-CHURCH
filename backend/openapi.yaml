        - settings
      summary: "Lire les réglages du site"
      description: "Document unique, sans identifiant : regroupe les scalaires de `site_settings` (exposés en objet clé/valeur) et la liste ordonnée des liens sociaux. Les deux sources sont lues en parallèle."
      security: []
      responses:
        "200":
          description: "Réglages courants."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Settings"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    patch:
      operationId: settingsUpdate
      tags:
        - settings
      summary: "Mettre à jour les réglages du site"
      description: "Administration. Mise à jour en masse de scalaires. La liste des clés écrivables est **fermée** : une clé inconnue fait échouer toute l'opération plutôt que d'être ignorée silencieusement. La réponse est l'état **complet relu**, qui contient donc aussi les clés absentes de la requête."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                settings:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 1
                    maxLength: 500
              required:
