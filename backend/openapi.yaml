          "$ref": "#/components/responses/InternalError"
  "/api/v1/media/{id}":
    get:
      operationId: mediaGet
      tags:
        - media
      summary: "Lire un média"
      description: "Administration. Aucun champ interne n'est exposé : ni clé, ni jeton."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID du média."
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Média trouvé."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Media"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`MEDIA_NOT_FOUND` — aucun média ne correspond à cet identifiant."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    delete:
      operationId: mediaDelete
      tags:
        - media
      summary: "Supprimer un média"
      description: "Administration. Refusée par défaut si le fichier est encore référencé : la réponse est alors `CONFLICT` avec le détail des usages. `?force=true` détache d'abord les références, puis supprime la ligne **et** le fichier du Storage. Seule la chaîne littérale `true` autorise la suppression forcée : `false` ou toute autre valeur est refusée par Zod (une valeur quelconque ne doit pas être convertie en booléen, `Boolean(\"false\")` valant `true`)."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant UUID du média."
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          description: "`true` pour supprimer un média encore référencé (les références sont détachées). Défaut : `false`."
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
      responses:
        "204":
          description: "Média supprimé du registre et du Storage : corps vide."
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`MEDIA_NOT_FOUND` — aucun média ne correspond à cet identifiant."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "`CONFLICT` — le média est encore utilisé et `force` n'est pas `true`. `details: { total, usages }`."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/prayer-requests":
    post:
      operationId: prayerRequestsSubmit
      tags:
        - "prayer-requests"
      summary: "Déposer une demande de prière"
      description: "**Route publique** : c'est le seul point d'écriture ouvert à un visiteur non authentifié. Le corps est un objet **strict** : toute clé inconnue provoque un 400 plutôt que d'être ignorée, et un champ non prévu ne peut pas être injecté dans la ligne.\n\nLa route est **rate-limitée à 5 dépôts par heure et par IP** (`prayer-request.routes.ts`), en plus de la limite globale. Le compteur est indexé sur l'adresse IP réelle (`trust proxy` activé pour Railway).\n\nLa réponse est volontairement minimale : ni le texte de l'intention, ni le prénom, ni le contact ne sont renvoyés — ces données personnelles sensibles ne circulent pas une seconde fois."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                requestText:
                  type: string
                  minLength: 1
                  maxLength: 1000
                requesterName:
                  type: string
                  maxLength: 120
                requesterContact:
                  type: string
                  maxLength: 120
                confidentiality:
                  type: string
                  enum:
                    - private
                    - community
                  default: private
              required:
                - requestText
              additionalProperties: false
      responses:
        "201":
          description: "Demande enregistrée."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PrayerRequestCreated"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimitedPublicWrite"
        "500":
          "$ref": "#/components/responses/InternalError"
    get:
      operationId: prayerRequestsList
      tags:
        - "prayer-requests"
      summary: "Lister les demandes de prière"
      description: "**Administration uniquement.** Lecture jamais publique : le formulaire affirme au visiteur que sa demande « ne sera jamais publiée sur Internet ni sur les réseaux sociaux ». Ordre fixé par le serveur (date décroissante) ; aucun paramètre de tri n'existe."
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: "Filtrer par état. Omis ⇒ toutes les demandes."
          schema:
            type: string
            enum:
              - NEW
              - PRAYED
      responses:
        "200":
          description: "Collection paginée de demandes."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PrayerRequestCollection"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
