      summary: "Remplacer les activités d'un département"
      description: "Administration (`ADMIN` ou `SUPER_ADMIN`). Remplacement **total** : la liste envoyée devient l'état des activités, **dans son ordre**, et les activités absentes du corps sont supprimées — la transaction efface puis réinsère. L'opération est idempotente : rejouer le même corps laisse la même collection. La réponse est la collection **relue depuis la base**, ce qui fournit les `id` et `imageUrl` définitifs des activités créées."
      security:
        - bearerAuth: []
      parameters:
        - name: idOrSlug
          in: path
