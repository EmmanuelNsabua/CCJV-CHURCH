      responses:
        "200":
          description: "Réglages mis à jour et relus."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Settings"
        "400":
          description: "`VALIDATION_ERROR` — objet `settings` vide (`Aucun réglage à mettre à jour`, `details: { allowedKeys }`), ou clé non autorisée (`Clé de réglage non autorisée : …`, `details: { unknownKeys, allowedKeys }`). Une valeur vide ou blanche est refusée par Zod (1 à 500 caractères)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/pages/{pageKey}":
    get:
      operationId: pagesGet
      tags:
        - pages
      summary: "Lire le contenu d'une page éditable"
      description: "Il n'existe pas de route de collection : l'énumération des clés éditables vient du registre `domain/content/page-content.ts`, pas de la base. Une clé hors registre produit `PAGE_NOT_FOUND`."
      security: []
      parameters:
        - name: pageKey
          in: path
          required: true
          description: "Clé de la page (1 à 60 caractères), telle que le frontend la connaît. Volontairement permissive : une clé inconnue produit un 404 métier (`PAGE_NOT_FOUND`), pas un 400 de forme."
          schema:
            type: string
            minLength: 1
            maxLength: 60
      responses:
        "200":
          description: "Contenu de la page."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StaticPage"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "404":
          description: "`PAGE_NOT_FOUND` — aucune page ne correspond à cette `pageKey`."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    patch:
      operationId: pagesUpdate
      tags:
        - pages
      summary: "Mettre à jour le contenu d'une page éditable"
      description: "Administration. La validation est faite **en deux temps** : forme générale (`{ content: objet }`) par Zod, puis contenu par le schéma de la page dans le service — c'est la seule façon de rejeter une `pageKey` inconnue en `PAGE_NOT_FOUND` et un contenu non conforme en `VALIDATION_ERROR`. `updatedBy` est déduit du jeton vérifié, jamais du corps de la requête : un client ne peut pas falsifier l'auteur de la modification."
      security:
        - bearerAuth: []
      parameters:
        - name: pageKey
          in: path
          required: true
          description: "Clé de la page (1 à 60 caractères), telle que le frontend la connaît. Volontairement permissive : une clé inconnue produit un 404 métier (`PAGE_NOT_FOUND`), pas un 400 de forme."
          schema:
            type: string
            minLength: 1
            maxLength: 60
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                content:
                  type: object
                  additionalProperties: {}
              required:
                - content
      responses:
        "200":
          description: "Contenu mis à jour."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StaticPage"
        "400":
          description: "`VALIDATION_ERROR` — `content` n'est pas un objet, ou son contenu ne respecte pas le schéma de la page concernée. `details` décrit les champs fautifs."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "`PAGE_NOT_FOUND` — la `pageKey` n'est pas une page éditable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/media":
    get:
      operationId: mediaList
      tags:
        - media
      summary: "Lister les médias"
      description: "Administration : le registre des fichiers téléversés n'est **jamais** public. Collection paginée, sans filtre serveur."
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Numéro de page (commence à 1). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Taille de page (1 à 100 inclus). Valeur hors bornes ⇒ 400 VALIDATION_ERROR."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Collection paginée de médias."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MediaCollection"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    post:
      operationId: mediaUpload
      tags:
        - media
      summary: "Téléverser un média"
      description: "Administration. Corps `multipart/form-data` : un champ fichier `file` et un champ texte `folder`, plus un `alt` facultatif.\n\nLe téléversement est fait **en mémoire** (`multer.memoryStorage()`) : rien n'est jamais écrit sur le disque du serveur, éphémère sur l'hébergement. Type et taille sont contrôlés par `StorageService` à partir des **octets** du fichier — jamais du `Content-Type` ni du nom de fichier envoyés par le client — et le nom du fichier stocké est généré par le serveur (UUID + extension), ce qui élimine les traversées de chemin et les collisions."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              "$ref": "#/components/schemas/UploadMediaRequest"
      responses:
        "201":
          description: "Média téléversé et enregistré."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Media"
        "400":
          description: "`VALIDATION_ERROR` — champ `folder` absent ou hors de la liste autorisée, `alt` trop long, aucun fichier reçu sous le nom de champ `file` (« Aucun fichier reçu : le champ de formulaire « file » est requis »), ou plusieurs fichiers envoyés. `details` indique le champ fautif."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          "$ref": "#/components/responses/AuthenticationRequired"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/FileTooLarge"
        "415":
          "$ref": "#/components/responses/InvalidFileType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
